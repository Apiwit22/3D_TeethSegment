    pp_merge_foreign_islands_min_boundary_support: 4
    pp_merge_foreign_islands_dominance: 0.74
    pp_merge_foreign_islands_max_mean_label_prob: 0.60
    pp_merge_foreign_islands_max_mean_max_prob: 0.72
    pp_merge_foreign_islands_allow_to_gingiva: false

    pp_close_gap_enabled: true
