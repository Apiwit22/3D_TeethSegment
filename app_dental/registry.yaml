presets:
  # =========================================================
  # MeshSegNet (Face)
  # =========================================================
  meshsegnet_upper:
    arch: upper
    runner: meshsegnet
    model_import: app.models.meshsegnet_repo_wrapper:MeshSegNetBatch
    model_kwargs:
      num_classes: 17
      in_channels: 15
      knn_s: 16
      knn_l: 64
      with_dropout: true
      dropout_p: 0.5

    target_faces: 16000
    do_orient: true
    do_normalize: true
    allow_reflection: false
    ref_path: assets/ref/007_U.ply

    do_postprocess: true
    pp_mode: best_visual
    pp_knn_k: 12
    pp_conf_thresh: 0.63
    pp_conf_neighbor_iters: 1
    pp_min_comp_size: 28
    pp_clean_iters: 1
    pp_smooth_iters: 2
    pp_ungingiva_margin: 0.06
    pp_ungingiva_min_tooth_p: 0.14
    pp_keep_gingiva_lcc: true

    pp_remove_tooth_islands_enabled: true
    pp_remove_tooth_islands_iters: 2
    pp_remove_tooth_islands_max_region_size: 8
    pp_remove_tooth_islands_min_gingiva_support: 4
    pp_remove_tooth_islands_dominance: 0.78
    pp_remove_tooth_islands_max_mean_label_prob: 0.54
    pp_remove_tooth_islands_max_mean_max_prob: 0.66

    pp_merge_foreign_islands_enabled: true
    pp_merge_foreign_islands_iters: 2
    pp_merge_foreign_islands_max_region_size: 8
    pp_merge_foreign_islands_min_boundary_support: 4
    pp_merge_foreign_islands_dominance: 0.80
    pp_merge_foreign_islands_max_mean_label_prob: 0.56
    pp_merge_foreign_islands_max_mean_max_prob: 0.68
    pp_merge_foreign_islands_allow_to_gingiva: false

    pp_close_gap_enabled: true
    pp_close_gap_iters: 1
    pp_close_gap_min_support: 4
    pp_close_gap_dominance: 0.80
    pp_close_gap_max_region_size: 3

    ckpts:
      - models/builtin/meshsegnet/upper/dataset1_best.pth
      - models/builtin/meshsegnet/upper/dataset2_best.pth
      - models/builtin/meshsegnet/upper/dataset3_best.pth
      - models/builtin/meshsegnet/upper/dataset4_best.pth
      - models/builtin/meshsegnet/upper/dataset5_best.pth

  meshsegnet_lower:
    arch: lower
    runner: meshsegnet
    model_import: app.models.meshsegnet_repo_wrapper:MeshSegNetBatch
    model_kwargs:
      num_classes: 17
      in_channels: 15
      knn_s: 16
      knn_l: 64
      with_dropout: true
      dropout_p: 0.5

    target_faces: 16000
    do_orient: true
    do_normalize: true
    allow_reflection: false
    ref_path: assets/ref/007_L.ply

    do_postprocess: true
    pp_mode: best_visual
    pp_knn_k: 12
    pp_conf_thresh: 0.63
    pp_conf_neighbor_iters: 1
    pp_min_comp_size: 28
    pp_clean_iters: 1
    pp_smooth_iters: 1
    pp_ungingiva_margin: 0.06
    pp_ungingiva_min_tooth_p: 0.14
    pp_keep_gingiva_lcc: true

    pp_remove_tooth_islands_enabled: true
    pp_remove_tooth_islands_iters: 2
    pp_remove_tooth_islands_max_region_size: 8
    pp_remove_tooth_islands_min_gingiva_support: 4
    pp_remove_tooth_islands_dominance: 0.78
    pp_remove_tooth_islands_max_mean_label_prob: 0.54
    pp_remove_tooth_islands_max_mean_max_prob: 0.66

    pp_merge_foreign_islands_enabled: true
    pp_merge_foreign_islands_iters: 2
    pp_merge_foreign_islands_max_region_size: 8
    pp_merge_foreign_islands_min_boundary_support: 4
    pp_merge_foreign_islands_dominance: 0.80
    pp_merge_foreign_islands_max_mean_label_prob: 0.56
    pp_merge_foreign_islands_max_mean_max_prob: 0.68
    pp_merge_foreign_islands_allow_to_gingiva: false

    pp_close_gap_enabled: true
    pp_close_gap_iters: 1
    pp_close_gap_min_support: 4
    pp_close_gap_dominance: 0.80
    pp_close_gap_max_region_size: 3

    ckpts:
      - models/builtin/meshsegnet/lower/dataset1_best.pth
      - models/builtin/meshsegnet/lower/dataset2_best.pth
      - models/builtin/meshsegnet/lower/dataset3_best.pth
      - models/builtin/meshsegnet/lower/dataset4_best.pth
      - models/builtin/meshsegnet/lower/dataset5_best.pth

  # =========================================================
  # PointNet++ (Point)
  # =========================================================
  pointnetpp_upper:
    arch: upper
    runner: pointnetpp
    model_import: app.models.pointnetpp:PointNet2Seg
    model_kwargs:
      in_channels: 6
      num_classes: 17
      sa_npoints: [2048, 512, 128]
      sa_radii: [0.05, 0.10, 0.20]
      sa_nsamples: [32, 32, 32]
      dropout: 0.5

    num_points: 8192
    point_feature: xyz_n

    pt_deterministic_sampling: true
    pt_sample_seed: 1234
    pt_mc_passes: 4
    pt_cover_faces: true
    pt_cover_jitter: 0.002

    target_faces: 16000
    do_orient: true
    do_normalize: true
    allow_reflection: false
    ref_path: assets/ref/007_U.ply

    do_postprocess: true
    pp_mode: best_visual
    pp_knn_k: 14
    pp_conf_thresh: 0.58
    pp_conf_neighbor_iters: 1
    pp_min_comp_size: 25
    pp_clean_iters: 1
    pp_smooth_iters: 1
    pp_ungingiva_margin: 0.04
    pp_ungingiva_min_tooth_p: 0.10
    pp_keep_gingiva_lcc: true

    pp_remove_tooth_islands_enabled: true
    pp_remove_tooth_islands_iters: 2
    pp_remove_tooth_islands_max_region_size: 18
    pp_remove_tooth_islands_min_gingiva_support: 4
    pp_remove_tooth_islands_dominance: 0.60

    pp_close_gap_enabled: true
    pp_close_gap_iters: 1
    pp_close_gap_min_support: 4
    pp_close_gap_dominance: 0.76
    pp_close_gap_max_region_size: 4

    ckpts:
      - models/builtin/pointnetpp/upper/dataset1_best.pth
      - models/builtin/pointnetpp/upper/dataset2_best.pth
      - models/builtin/pointnetpp/upper/dataset3_best.pth
      - models/builtin/pointnetpp/upper/dataset4_best.pth
      - models/builtin/pointnetpp/upper/dataset5_best.pth

  pointnetpp_lower:
    arch: lower
    runner: pointnetpp
    model_import: app.models.pointnetpp:PointNet2Seg
    model_kwargs:
      in_channels: 6
      num_classes: 17
      sa_npoints: [2048, 512, 128]
      sa_radii: [0.05, 0.10, 0.20]
      sa_nsamples: [32, 32, 32]
